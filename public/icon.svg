      M 160 380
      C 230 380 320 340 340 220
      C 352 220 370 205 382 192
      C 368 198 355 200 342 198
      C 358 186 370 170 375 152
      C 360 162 344 168 326 172
      C 310 154 288 144 262 144
      C 214 144 175 183 175 231
      C 175 238 176 244 178 250
      C 112 246 56 210 20 162
      C 12 176 8 192 8 210
      C 8 240 24 267 48 283
      C 34 282 20 278 8 271
      C 8 312 38 347 78 355
      C 70 357 62 358 54 358
      C 48 358 42 357 37 356
      C 48 390 80 414 118 415
      C 88 438 50 452 8 452
      C 30 466 56 474 84 474
      C 180 474 270 390 270 250
      Z
    " />

    <!-- 1. Nutka przy dziobie (100% krycia) -->
    <g transform="translate(365, 115) scale(1.05)" opacity="1.0">
      <ellipse cx="14" cy="30" rx="8" ry="6" transform="rotate(-20 14 30)" />
      <rect x="19" y="8" width="3.5" height="23" rx="1.5" />
      <path d="M 22.5 8 C 32 10 38 16 36 24 C 34 18 30 14 22.5 13.5 Z" />
    </g>

    <!-- 2. Nutka środkowa (60% krycia) -->
    <g transform="translate(415, 55) scale(0.8) rotate(14)" opacity="0.60">
      <ellipse cx="12" cy="28" rx="7" ry="5.5" transform="rotate(-20 12 28)" />
      <ellipse cx="32" cy="23" rx="7" ry="5.5" transform="rotate(-20 32 23)" />
      <rect x="16" y="7" width="3" height="22" rx="1" />
      <rect x="36" y="2" width="3" height="22" rx="1" />
      <polygon points="16,7 39,2 39,7.5 16,12.5" />
    </g>

    <!-- 3. Nutka najwyższa, zanikająca (25% krycia) -->
    <g transform="translate(465, 5) scale(0.58) rotate(26)" opacity="0.25">
      <ellipse cx="14" cy="30" rx="8" ry="6" transform="rotate(-20 14 30)" />
      <rect x="19" y="8" width="3.5" height="23" rx="1.5" />
